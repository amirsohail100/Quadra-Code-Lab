<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartra - DSA practice</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-track="dsa">
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="Open categories">☰</button>
    <div class="brand"><a href="index.html">◆ <span>Quartra</span></a> <small id="trackTitle"></small></div>
    <nav class="topnav"><a href="index.html">Home</a><a href="python.html">Python</a><a href="cpp.html">C++</a><a href="dsa.html" class="active">DSA</a><a href="sql.html">SQL</a></nav>
    <div class="overall" title="Progress in this track">
      <div class="bar"><i id="overallBar"></i></div>
      <span id="overallText"></span>
    </div>
    <div class="tts-settings" id="ttsSettings">
      <select id="voiceSelect" aria-label="Voice"></select>
      <label class="speed">Speed
        <input type="range" id="rate" min="0.6" max="1.6" step="0.1" value="1">
      </label>
    </div>
    <button id="themeBtn" class="icon-btn" aria-label="Toggle theme">🌙</button>
  </header>
  <div class="layout">
    <aside id="sidebar">
      <nav id="catList"></nav>
      <button id="resetBtn" class="ghost small">Reset DSA progress</button>
    </aside>
    <div id="backdrop"></div>
    <main id="main"></main>
  </div>
  <div id="toast" role="status"></div>
  <script src="js/tracks.js"></script>
  <script src="data/dsa.questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
